[project]
name = "mizan"
version = "0.1.0"
description = "Halal-constrained market simulation and research sandbox (single-user, deterministic, batch)."
requires-python = ">=3.11,<3.15"

dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
# `data` extra NARROWED in Phase 3 (PHASE_3_SPEC.md §2.1) — duckdb/pyarrow are no longer
# forward-declared, they are real Phase 3 dependencies (mizan/data/db.py, mizan/data/normalize.py).
# `pandas` remains forward-declared and unused, same rationale as Phase 1/2: harmless to install, a
# review-blocking finding to import before its owning phase (PHASE_1_SPEC.md §7, §9;
# PHASE_2_SPEC.md §5, guard G13/G-DEP1; PHASE_3_SPEC.md §2.2, §7 guard G-DEP3).
data = [
    "pandas==3.0.5",
]
report = [
    "matplotlib==3.11.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.5",
    "pytest==9.1.1",
]

[project.scripts]
mizan-boot-check = "mizan.config.boot_check:main"
mizan = "mizan.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.11"          # lowest supported interpreter — check against the floor, not the ceiling
files = ["mizan", "tests"]
warn_unused_configs = true

# `pyarrow` 25.0.1 ships no inline type stubs / py.typed marker (confirmed live, PHASE_3_SPEC.md
# §2.1's promoted dependency) — this narrowly silences mypy's import-untyped complaint about the
# third-party package itself; it does not relax --strict for any Mizan-owned module.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "TID", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
