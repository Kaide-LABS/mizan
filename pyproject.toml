[project]
name = "mizan"
version = "0.1.0"
description = "Halal-constrained market simulation and research sandbox (single-user, deterministic, batch)."
requires-python = ">=3.11,<3.15"

dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# `ingest` extra REMOVED in Phase 2 (PHASE_2_SPEC.md §2.1) — httpx is no longer forward-declared,
# it is a real runtime dependency imported by mizan/data/ingest_edgar.py and
# mizan/data/ingest_tiingo.py. The two extras below remain forward-declared and unused, same
# rationale as Phase 1: harmless to install, a review-blocking finding to import before their
# owning phase (PHASE_1_SPEC.md §7, §9; PHASE_2_SPEC.md §5, guard G13/G-DEP1).
data = [
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "pandas==3.0.5",
]
report = [
    "matplotlib==3.11.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.5",
    "pytest==9.1.1",
]

[project.scripts]
mizan-boot-check = "mizan.config.boot_check:main"
mizan = "mizan.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.11"          # lowest supported interpreter — check against the floor, not the ceiling
files = ["mizan", "tests"]
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "TID", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
